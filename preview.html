<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkInBio Studio</title>
    
    <!-- Meta tags for sharing -->
    <meta property="og:title" id="og-title" content="My LinkInBio">
    <meta property="og:description" id="og-desc" content="Check out my links and social media profiles!">
    <meta property="og:type" content="website">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
    <!-- Core Style -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Preview-Specific CSS to strip out editor cruft -->
    <style>
        body {
            /* Force view mode styling globally */
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
        }

        .preview-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            padding: 3rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Will be styled dynamically by JS theme loader */
        }
        
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: var(--accent);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        #error-card {
            display: none;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-lg);
            padding: 3rem 2rem;
            text-align: center;
            margin-top: 20vh;
        }
    </style>
</head>
<body class="view-mode">

    <!-- Loading State -->
    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
        <p style="margin-top: 1rem; color: var(--text-secondary); font-size: 0.9rem;">Profil yükleniyor...</p>
    </div>

    <!-- Error State -->
    <div id="error-card">
        <div style="font-size: 3rem; margin-bottom: 1rem;">😢</div>
        <h2 style="margin-bottom: 0.5rem;">Profil Bulunamadı</h2>
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">Aradığınız bağlantı ağacı mevcut değil veya adı değişmiş.</p>
        <a href="/" class="primary-btn" style="text-decoration: none;">Kendi Linkini Oluştur</a>
    </div>

    <!-- Main Container -->
    <div class="preview-container" id="main-container" style="display: none;">
        <div class="preview-header">
            <div class="profile-image-wrapper">
                <div class="profile-image" id="profile-img-container">
                    <!-- Default SVG Avatar -->
                    <svg viewBox="0 0 24 24" fill="none" class="avatar-svg">
                        <circle cx="12" cy="8" r="4" fill="currentColor" />
                        <path d="M4 22C4 17.5817 7.58172 14 12 14C16.4183 14 20 17.5817 20 22" stroke="currentColor" stroke-width="2" />
                    </svg>
                </div>
            </div>
            <h1 id="preview-name"></h1>
            <p id="preview-bio"></p>

            <!-- Social Icons -->
            <div class="social-icons" id="preview-social-icons"></div>
        </div>

        <!-- Links Box -->
        <div class="preview-links" id="preview-links-container"></div>

        <!-- Watermark -->
        <div class="preview-footer" id="preview-watermark">
            <a href="/" target="_blank" style="color: inherit; text-decoration: none;">
                <p>Created with <b>LinkInBio</b></p>
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Basic DOM sanitizer -->
    <script>
        function sanitizeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }
    </script>
    <script src="preview.js"></script>
</body>
</html>
